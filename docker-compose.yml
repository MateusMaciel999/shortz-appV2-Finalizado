services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shortz}
      MYSQL_USER: ${DB_USER:-shortz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shortz}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-shortz}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortz}
      DB_USER: ${DB_USER:-shortz}
      DB_PASSWORD: ${DB_PASSWORD:-shortz}
    volumes:
      - uploads:/app/public/uploads

volumes:
  db_data:
  uploads:
